<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(#ffe6eb, #fff);
      text-align: center;
      padding-top: 60px;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ff5c8a;
      margin-bottom: 20px;
    }

    h1 {
      color: #ff477e;
      font-size: 2.5em;
    }

    p {
      color: #555;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background: #ff477e;
      color: white;
    }

    #no {
      background: #ddd;
      position: absolute;
    }
  </style>
</head>
<body>

  <img src="photo.jpg" class="avatar" alt="Us">

  <h1>Will you be my Valentine? 💖</h1>
  <p>I’ve been meaning to ask you this for a while…</p>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes, I will 💕</button>
    <button id="no" onmouseover="moveNo()">No 😅</button>
  </div>

  <script>
    function yesClicked() {
      document.body.innerHTML = "<h1>YAY!!! 💘🥰</h1><p>I love you!</p>";
    }

    function moveNo() {
      const no = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      no.style.left = x + "px";
      no.style.top = y + "px";
    }
  </script>

</body>
</html>
